<!doctype html>
<html lang="zh-hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>110 回傳 Promise 的函式與 then 串接</title>
  </head>
  <body>
    <button id="btn" onclick="myTest()">Run</button>

    <hr />

    <pre id="my"></pre>

    <script>
      function myPromise(n = "a") {
        return new Promise((resolve, reject) => {
          const ms = 100 + Math.random() * 500;
          setTimeout(() => {
            resolve({ n, ms });
          }, ms);
        });
      }

      function myTest() {
        myPromise("a1")
          .then((result) => {
            console.log(result);
            return myPromise("a2");
          })
          .then((result) => {
            console.log(result);
          });
      }
    </script>
  </body>
</html>
